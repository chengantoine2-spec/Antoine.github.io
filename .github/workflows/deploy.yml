name: Deploy to GitHub Pages

# 已启用 push 触发：推到 main 就会构建并发布。
# 旧站已备份在远端分支 legacy-xp-desktop，需要时可以从那里恢复。
# 想改回手动发布：把 push 那两行注释掉即可。
#
# Pages 的 Source 必须是 "GitHub Actions"（仓库 Settings → Pages）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 仓库名恰好等于 <owner>.github.io 时是用户站（根路径），其余都是项目站（/<repo>/）
      - name: Resolve base path
        id: base
        run: |
          name="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "$name" == "$owner.github.io" ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
