name: Deploy to GitHub Pages

# 现在是**手动触发**，不会因为 push 自动上线：
# 这个仓库（chengantoine2-spec/Antoine.github.io）当前正托管着旧站点，
# 一旦 push 触发就会把它覆盖掉。等确认要换站时，把下面 push 那两行取消注释即可。
#
# 首次启用前：仓库 Settings → Pages，把 Source 设为 "GitHub Actions"。

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 仓库名恰好等于 <owner>.github.io 时是用户站（根路径），其余都是项目站（/<repo>/）
      - name: Resolve base path
        id: base
        run: |
          name="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "$name" == "$owner.github.io" ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
