<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="音乐">
  <!-- 本站原创（自绘），无任何第三方素材；形状 = squircle 44..468 圆角 96 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#FDA4AF"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="44" y="44" width="424" height="424" rx="96"/></clipPath>
  </defs>
  <rect x="44" y="44" width="424" height="424" rx="96" fill="url(#g)"/>
  <g clip-path="url(#c)"><rect x="44" y="44" width="424" height="424" fill="url(#hl)"/></g>
  <!-- 双符头 + 连接符杠（白色粗符号，28px 下也认得出） -->
  <g fill="#fff">
