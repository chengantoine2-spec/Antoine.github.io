    <rect x="302" y="122" width="26" height="196" rx="13"/>
    <path d="M196 150 L328 122 L328 168 L196 196 Z"/>
    <circle cx="180" cy="346" r="44"/>
    <circle cx="286" cy="318" r="44"/>
  </g>
