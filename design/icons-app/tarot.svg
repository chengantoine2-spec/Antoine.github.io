<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="塔罗牌">
  <!-- 本站原创（自绘），无任何第三方素材；形状 = squircle 44..468 圆角 96 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#D8B4FE"/><stop offset="1" stop-color="#7E22CE"/></linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="44" y="44" width="424" height="424" rx="96"/></clipPath>
  </defs>
  <rect x="44" y="44" width="424" height="424" rx="96" fill="url(#g)"/>
  <g clip-path="url(#c)"><rect x="44" y="44" width="424" height="424" fill="url(#hl)"/></g>
  <!-- 两张交叠的牌 + 牌面星（2026-10-06 修：原来只有一张牌，28px 下与「博客」的文稿撞脸；改成"双牌斜置"剪影） -->
  <g transform="translate(256 256) scale(1.16) translate(-256 -256)" fill="#fff">
    <g transform="rotate(11 256 256)" opacity=".5"><rect x="188" y="130" width="136" height="200" rx="20"/></g>
    <g transform="rotate(-14 256 256)"><rect x="186" y="124" width="140" height="208" rx="22"/></g>
    <g transform="rotate(-14 256 256)"><path d="M256 178 L272 226 L320 242 L272 258 L256 306 L240 258 L192 242 L240 226 Z" fill="#7E22CE" opacity=".8"/></g>
  </g>
</svg>
