<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 草稿 A · 所有项目：九宫格从"9 个点"改成 **9 个圆角方块**（macOS 启动台的样子）——
       点阵在 12px 下是 9 个 0.85px 的灰点，方块是 2.2px 的实心块，第 1 眼就能看出是个九宫格 -->
  <g fill="currentColor" stroke="none">
    <rect x="3.4" y="3.4" width="4.4" height="4.4" rx="1.3" />
    <rect x="9.8" y="3.4" width="4.4" height="4.4" rx="1.3" />
    <rect x="16.2" y="3.4" width="4.4" height="4.4" rx="1.3" />
    <rect x="3.4" y="9.8" width="4.4" height="4.4" rx="1.3" />
    <rect x="9.8" y="9.8" width="4.4" height="4.4" rx="1.3" />
    <rect x="16.2" y="9.8" width="4.4" height="4.4" rx="1.3" />
    <rect x="3.4" y="16.2" width="4.4" height="4.4" rx="1.3" />
    <rect x="9.8" y="16.2" width="4.4" height="4.4" rx="1.3" />
    <rect x="16.2" y="16.2" width="4.4" height="4.4" rx="1.3" />
  </g>
</svg>
