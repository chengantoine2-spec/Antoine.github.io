<!doctype html>
<html lang="zh-CN" data-theme="caramel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内联 SVG 图标：省一个请求，也修掉之前每个页面都报的 favicon.ico 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a96f44'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23f7e6d0'/%3E%3Crect x='7' y='20' width='18' height='4' rx='2' fill='%23fff8f0'/%3E%3C/svg%3E"
    />
    <title>桌面 · 个人站</title>
    <script>
      /* 首屏前置主题，避免刷新时闪成另一套配色；与 useAppearance 共用同一个 key */
      ;(function () {
        try {
          var t = localStorage.getItem('desktop.theme')
          if (t === 'caramel' || t === 'linen' || t === 'night') {
            document.documentElement.dataset.theme = t
          }
        } catch (e) {
          /* 隐私模式下读不到 localStorage 时忽略 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
