<!doctype html>
<html lang="zh-CN" data-theme="caramel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面 · 个人站</title>
    <script>
      /* 首屏前置主题，避免刷新时闪成另一套配色；与 useAppearance 共用同一个 key */
      ;(function () {
        try {
          var t = localStorage.getItem('desktop.theme')
          if (t === 'caramel' || t === 'linen' || t === 'night') {
            document.documentElement.dataset.theme = t
          }
        } catch (e) {
          /* 隐私模式下读不到 localStorage 时忽略 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
